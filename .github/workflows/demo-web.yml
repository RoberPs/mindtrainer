name: Demo web

# Publica la demo web en GitHub Pages: https://roberps.github.io/mindtrainer/
# Es solo para probar la app desde un enlace; el producto es la app de Android.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Un solo despliegue a la vez; no se cancela uno que ya esté en marcha.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  compilar:
    name: Compilar la web
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Compilar la versión web
        run: npx expo export -p web

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  publicar:
    name: Publicar en GitHub Pages
    needs: compilar
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.despliegue.outputs.page_url }}
    steps:
      - id: despliegue
        uses: actions/deploy-pages@v4
