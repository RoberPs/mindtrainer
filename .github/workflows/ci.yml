name: CI

on:
  push:
    branches: [main]
  pull_request:

# Solo lectura: la CI no necesita escribir en el repositorio.
permissions:
  contents: read

# Si llega un push nuevo a la misma rama, cancela la ejecución anterior.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pruebas:
    name: Tipos y pruebas
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Comprobar tipos
        run: npm run typecheck

      - name: Revisar el código (ESLint)
        run: npm run lint -- --max-warnings 0

      - name: Pruebas
        run: npm test -- --ci
